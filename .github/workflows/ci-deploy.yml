name: CI and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt an active deployment. New PR updates can cancel older checks.
concurrency:
  group: soundworks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: generation/requirements.txt
      - run: npm ci
      - run: python -m pip install -r generation/requirements.txt
      - run: npm run check -w @soundworks/api
      - run: npm test -w @soundworks/api
      - run: node --test apps/reader/test/*.test.js
      - name: Test audio generation without calling AWS
        run: PYTHONPATH=generation python -m unittest discover -s generation/tests
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_DEFAULT_REGION: us-west-2
      - name: Build reader and validate infrastructure
        run: npm test -w @soundworks/infra

  deploy:
    name: Deploy workshop
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-west-2
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Verify one-time AWS setup
        run: |
          if [[ ! "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ || -z "$AWS_DEPLOY_ROLE_ARN" ]]; then
            echo '::error::Set repository variables AWS_ACCOUNT_ID and AWS_DEPLOY_ROLE_ARN. See docs/ci-cd.md.'
            exit 1
          fi
      - run: npm ci
      - name: Authenticate to AWS using short-lived credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: soundworks-${{ github.run_id }}
          role-duration-seconds: 3600
      - name: Deploy reader, API, and audio-generation infrastructure
        run: npm run deploy -w @soundworks/infra -- SoundWorksSandbox --ci --require-approval never --outputs-file cdk.out/outputs.json
      - name: Verify deployed reader and API
        run: |
          READER_URL=$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('infra/cdk.out/outputs.json')).SoundWorksSandbox.ReaderUrl)")
          node scripts/smoke-deployment.mjs "$READER_URL"
          echo "### Deployed SoundWorks" >> "$GITHUB_STEP_SUMMARY"
          echo "Reader: $READER_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
